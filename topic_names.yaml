# Human-readable names for the LDA topics produced by `analyze.py topics fit`.
#
# Keys are "<lang>:<topic id>". Names were assigned by reading the top terms and
# the representative documents in data/derived/topics/topics_<lang>.txt — the
# model does not name its own topics. Re-running `topics fit` with different
# parameters renumbers the topics, so re-read the dump before editing.

